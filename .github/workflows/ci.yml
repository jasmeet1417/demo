# THE RELEASE JOURNEY (this file is the detective + factory + warehouse + truck)
#
# 👨‍💻 Rahul  →  git push
# 🕵️ CI      →  job "detective"   (checkout → test → package)
# 🏭 Factory →  job "factory"     (same JAR → Docker image)
# 📦 Warehouse → docker push to GitHub Container Registry
# 🚚 CD      →  jobs "dev / stage / prod"  (promote the SAME image)
#
# The factory does not ship until the detective approves (needs: detective).

name: Release Journey

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

permissions:
  contents: read
  packages: write

jobs:
  detective:
    name: 🕵️ CI — build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout — show me exactly what Rahul pushed
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test — does it behave as expected?
        run: ./mvnw -B test

      - name: Package — produce one deployable JAR
        run: ./mvnw -B package -DskipTests

      - name: Keep the JAR so later jobs reuse the SAME artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar

  factory:
    name: 🏭 Factory — Docker image
    needs: detective
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout Dockerfile
        uses: actions/checkout@v4

      - name: Download the JAR the detective already approved
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Name the image with a real version (never only "latest")
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="${GITHUB_SHA::7}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tagged as $IMAGE:$TAG and $IMAGE:1.0.0"

      - name: Build the sealed shipping container
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            -t "${{ steps.meta.outputs.image }}:1.0.0" \
            .

      - name: Login to the warehouse (GitHub Container Registry)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the versioned image to the warehouse
        if: github.event_name == 'push'
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.image }}:1.0.0"

  deploy-dev:
    name: 🟢 Promote to DEV
    needs: factory
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Promote the SAME image — do not rebuild
        run: |
          echo "DEV now points at ${{ needs.factory.outputs.image }}:${{ needs.factory.outputs.tag }}"
          echo "Health check after deploy: GET /health"

  deploy-stage:
    name: 🟡 Promote to STAGE
    needs: [factory, deploy-dev]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Promote the SAME image to a production-like environment
        run: |
          echo "STAGE now points at ${{ needs.factory.outputs.image }}:${{ needs.factory.outputs.tag }}"

  deploy-prod:
    name: 🔴 Promote to PROD
    needs: [factory, deploy-stage]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Real users see this image
        run: |
          echo "PROD now points at ${{ needs.factory.outputs.image }}:${{ needs.factory.outputs.tag }}"
          echo "If error rate jumps, roll back by pointing PROD at the previous SHA tag."
